<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>DSE MC 成績查詢</title>
<meta name="description" content="DSE 數學卷二 MC 成績查詢：學生以班別及中文全名登入查閱個人成績；老師以密碼查閱全班成績及題目分析。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap" rel="stylesheet">
<script>try{var t=JSON.parse(localStorage.getItem("mc-theme"));if(t==="dark"||t==="light")document.documentElement.dataset.theme=t;}catch(e){}</script>
<style>
/* Layout idea: an OMR answer-sheet ledger. Login card -> student report (score, level scale, Set A/B, 45-cell sheet) or teacher ledger with filters. */
:root {
  --paper: #f3f5f8;
  --surface: #ffffff;
  --ink: #18212d;
  --muted: #5b6676;
  --line: #d9dfe8;
  --accent: #1f4fbf;
  --on-accent: #ffffff;
  --setA: #0f7a6c; --setA-soft: #e2f3f0;
  --setB: #8a3fb5; --setB-soft: #f2e8f8;
  --setC: #b45309; --setC-soft: #fbeedd;
  --ok: #1d8348; --ok-soft: #dff2e6;
  --bad: #c2352b; --bad-soft: #fbe5e2;
  --blank: #8f99a8; --blank-soft: #eceff3;
  --hover: #f7f9fc;
  --lv0: #c9cfd8; --lv1: #b9cdf3; --lv2: #8fb0ef; --lv3: #5f8ce6; --lv4: #3c6fd9; --lv5: #2553b8; --lv6: #163a8a;
  --lv-text-dark: #18212d;
  --font-display: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --font-body: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11161d; --surface: #182029; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2b3642;
    --accent: #7fa4ff; --on-accent: #0d1420;
    --setA: #4cc4b2; --setA-soft: #15322f; --setB: #c79bf0; --setB-soft: #2e2240; --setC: #f0a35e; --setC-soft: #3a2914;
    --ok: #52c785; --ok-soft: #173726; --bad: #ff8a7d; --bad-soft: #3d1f1d; --blank: #7b8696; --blank-soft: #232c37; --hover: #1d2631;
    --lv0: #3a4350; --lv1: #2b3d5e; --lv2: #31508a; --lv3: #3d65b0; --lv4: #557fd0; --lv5: #7c9fe6; --lv6: #a9c1f5;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11161d; --surface: #182029; --ink: #e6ebf2; --muted: #9aa6b6; --line: #2b3642;
  --accent: #7fa4ff; --on-accent: #0d1420;
  --setA: #4cc4b2; --setA-soft: #15322f; --setB: #c79bf0; --setB-soft: #2e2240; --setC: #f0a35e; --setC-soft: #3a2914;
  --ok: #52c785; --ok-soft: #173726; --bad: #ff8a7d; --bad-soft: #3d1f1d; --blank: #7b8696; --blank-soft: #232c37; --hover: #1d2631;
  --lv0: #3a4350; --lv1: #2b3d5e; --lv2: #31508a; --lv3: #3d65b0; --lv4: #557fd0; --lv5: #7c9fe6; --lv6: #a9c1f5;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.55; min-height: 100vh; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 20px clamp(16px, 3vw, 32px) 56px; display: grid; gap: 20px; }
.wrap.narrow { max-width: 980px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
h1 { font-family: var(--font-display); font-size: clamp(21px, 3vw, 28px); letter-spacing: .01em; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
.sub { color: var(--muted); margin-top: 4px; }
.mono { font-family: var(--font-mono); }
.num { font-variant-numeric: tabular-nums; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.btn { border: 1px solid var(--line); background: var(--paper); border-radius: 8px; padding: 6px 12px; cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.btn:disabled { opacity: .6; cursor: progress; }

/* top bar */
.topbar { display: flex; flex-wrap: wrap; gap: 10px 20px; justify-content: space-between; align-items: center; }
.who { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; color: var(--muted); font-size: 13px; }
.who strong { color: var(--ink); font-size: 14px; }
.role { border-radius: 999px; padding: 1px 10px; font-size: 12px; border: 1px solid var(--line); }

/* exam switch */
.examsw { display: flex; flex-wrap: wrap; gap: 8px; align-items: stretch; }
.examsw .flabel { align-self: center; margin-right: 4px; }
.exbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 7px 14px; cursor: pointer; display: grid; gap: 1px; text-align: left; min-width: 132px; }
.exbtn b { font-size: 15px; }
.exbtn span { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.exbtn:hover { border-color: var(--accent); }
.exbtn[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--hover); }
.exbtn[aria-pressed="true"] b { color: var(--accent); }

/* login */
.login-shell { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
.login { width: min(420px, 100%); display: grid; gap: 18px; padding: 26px 24px 22px; }
.login .brand { display: grid; gap: 4px; }
.login .brand .eyebrow { font-family: var(--font-mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 3px; background: var(--paper); }
.tab { border: 0; background: transparent; padding: 8px; border-radius: 8px; cursor: pointer; color: var(--muted); font-weight: 500; }
.tab[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; color: var(--muted); }
.field input, .field select { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); font-size: 15px; width: 100%; }
.pwwrap { position: relative; }
.pwwrap input { padding-right: 64px; }
.pwwrap button { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 6px; }
.wrap { grid-template-columns: minmax(0, 1fr); }
.ledger { overflow-x: auto; }
.login .links { display: flex; justify-content: center; gap: 18px; font-size: 13px; margin-top: -6px; }
.login .links a, .who a.btn { color: var(--accent); text-decoration: none; }
.login .links a:hover { text-decoration: underline; }
.exbtn:disabled { cursor: default; opacity: .55; }
.exbtn:disabled:hover { border-color: var(--line); }
.login .go { padding: 10px; font-size: 15px; font-weight: 500; }
.err { color: var(--bad); font-size: 13px; min-height: 1.4em; }
.hint { color: var(--muted); font-size: 12.5px; }

/* student report */
.hero { padding: 18px 20px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px 22px; align-items: end; }
.metric { display: grid; gap: 2px; }
.metric .k { color: var(--muted); font-size: 13px; }
.metric .v { font-size: 34px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.metric .v small { font-size: 15px; color: var(--muted); font-weight: 500; }
.metric .n { color: var(--muted); font-size: 12.5px; }
.lvbadge { display: inline-block; justify-self: start; border-radius: 8px; padding: 2px 12px; font-weight: 700; font-size: 26px; line-height: 1.3; }
.lvchip { display: inline-block; border-radius: 6px; padding: 1px 8px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
[data-lvi="0"] { background: var(--lv0); color: var(--ink); }
[data-lvi="1"] { background: var(--lv1); color: var(--lv-text-dark); }
[data-lvi="2"] { background: var(--lv2); color: var(--lv-text-dark); }
[data-lvi="3"] { background: var(--lv3); color: #fff; }
[data-lvi="4"] { background: var(--lv4); color: #fff; }
[data-lvi="5"] { background: var(--lv5); color: #fff; }
[data-lvi="6"] { background: var(--lv6); color: #fff; }
:root[data-theme="dark"] [data-lvi="1"], :root[data-theme="dark"] [data-lvi="2"] { color: #e6ebf2; }
:root[data-theme="dark"] [data-lvi="5"], :root[data-theme="dark"] [data-lvi="6"] { color: #0d1420; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) [data-lvi="1"], :root:not([data-theme="light"]) [data-lvi="2"] { color: #e6ebf2; }
  :root:not([data-theme="light"]) [data-lvi="5"], :root:not([data-theme="light"]) [data-lvi="6"] { color: #0d1420; }
}
.scale { padding: 16px 20px 14px; display: grid; gap: 10px; }
.scale-bar { position: relative; display: flex; height: 26px; border-radius: 6px; overflow: visible; margin-top: 22px; }
.scale-bar .seg { height: 100%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; }
.scale-bar .seg:first-child { border-radius: 6px 0 0 6px; }
.scale-bar .seg:last-child { border-radius: 0 6px 6px 0; }
.scale-bar .seg.dim { opacity: .45; }
.marker { position: absolute; top: -24px; transform: translateX(-50%); display: grid; justify-items: center; pointer-events: none; }
.marker b { background: var(--ink); color: var(--paper); font-size: 12px; border-radius: 5px; padding: 1px 7px; font-variant-numeric: tabular-nums; }
.marker i { width: 2px; height: 34px; background: var(--ink); }
.scale-ticks { position: relative; height: 16px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.scale-ticks span { position: absolute; transform: translateX(-50%); }
.scale-legend { display: flex; flex-wrap: wrap; gap: 6px 10px; font-size: 12.5px; color: var(--muted); }
.scale-legend .on { outline: 2px solid var(--ink); outline-offset: 1px; }
.next { font-weight: 500; }
.sets2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.setcard { padding: 16px 18px; display: grid; gap: 10px; align-content: start; }
.setcard.a { border-top: 3px solid var(--setA); }
.setcard.b { border-top: 3px solid var(--setB); }
.setcard.c { border-top: 3px solid var(--setC); }
.setcard.a h3 { color: var(--setA); }
.setcard.b h3 { color: var(--setB); }
.setcard.c h3 { color: var(--setC); }
.setcard .big { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.setcard .big small { font-size: 14px; color: var(--muted); font-weight: 500; }
.setcard .cmp { color: var(--muted); font-size: 12.5px; }
.secsplit { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.secsplit b { color: var(--ink); font-variant-numeric: tabular-nums; }
.defs { color: var(--muted); font-size: 12.5px; }
.sheet { padding: 16px 18px; display: grid; gap: 10px; }
.misstable { width: 100%; border-collapse: collapse; min-width: 460px; }
.misstable th, .misstable td { padding: 7px 10px; border-bottom: 1px solid var(--line); text-align: left; font-variant-numeric: tabular-nums; }
.misstable th { color: var(--muted); font-weight: 500; font-size: 13px; }
.misstable td.c { text-align: center; font-family: var(--font-mono); font-weight: 600; }
.tag { display: inline-block; font-size: 12px; border-radius: 5px; padding: 0 6px; }
.tag.a { background: var(--setA-soft); color: var(--setA); }
.tag.b { background: var(--setB-soft); color: var(--setB); }
.tag.c { background: var(--setC-soft); color: var(--setC); }
.tag.o { background: var(--blank-soft); color: var(--muted); }
.scroll-x { overflow-x: auto; }
.notice { padding: 22px; display: grid; gap: 8px; }

/* chips, cells */
.qs { display: flex; flex-wrap: wrap; gap: 4px; }
.q { font-family: var(--font-mono); font-size: 12px; line-height: 1; padding: 4px 5px; border-radius: 5px; display: inline-flex; gap: 3px; align-items: baseline; white-space: nowrap; }
.q.bad { background: var(--bad-soft); color: var(--bad); border: 1px solid transparent; }
.q.blank { background: transparent; color: var(--blank); border: 1px dashed var(--blank); }
.q sub { font-size: 10px; vertical-align: baseline; opacity: .85; }
.q.hl { outline: 2px solid var(--accent); outline-offset: 1px; }
.allok { color: var(--ok); font-size: 12.5px; font-weight: 500; }
.strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(42px, 1fr)); gap: 4px; }
.cell { border-radius: 6px; padding: 3px 0 4px; text-align: center; border: 1px solid var(--line); background: var(--surface); }
.cell .qn { display: block; font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; }
.cell .an { display: block; font-family: var(--font-mono); font-weight: 600; font-size: 14px; line-height: 1.2; }
.cell .ky { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--muted); }
.cell.ok { background: var(--ok-soft); border-color: transparent; }
.cell.ok .an { color: var(--ok); }
.cell.bad { background: var(--bad-soft); border-color: transparent; }
.cell.bad .an { color: var(--bad); }
.cell.blank { border-style: dashed; }
.cell.blank .an { color: var(--blank); }
.cell.inA { box-shadow: inset 0 3px 0 var(--setA); }
.cell.inB { box-shadow: inset 0 3px 0 var(--setB); }
.cell.inC { box-shadow: inset 0 3px 0 var(--setC); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.bar { height: 6px; border-radius: 3px; background: var(--blank-soft); overflow: hidden; }
.bar i { display: block; height: 100%; }
.bar.a i { background: var(--setA); }
.bar.b i { background: var(--setB); }
.bar.c i { background: var(--setC); }
.bar.big { height: 10px; border-radius: 5px; }

/* teacher */
.sets { display: flex; flex-wrap: wrap; gap: 8px; }
.setdef { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; max-width: 520px; }
.setdef b { margin-right: 6px; }
.setdef.a b { color: var(--setA); }
.setdef.b b { color: var(--setB); }
.setdef.c b { color: var(--setC); }
.setdef span { color: var(--muted); font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; display: grid; gap: 2px; }
.tile .k { color: var(--muted); font-size: 13px; }
.tile .v { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile .v small { font-size: 14px; font-weight: 500; color: var(--muted); }
.tile .n { color: var(--muted); font-size: 12.5px; }
.tile.a { border-top: 3px solid var(--setA); }
.tile.b { border-top: 3px solid var(--setB); }
.tile.c { border-top: 3px solid var(--setC); }
.levels { padding: 12px 14px; overflow-x: auto; }
.levels table { border-collapse: collapse; width: 100%; min-width: 600px; }
.levels th, .levels td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.levels th:first-child, .levels td:first-child, .levels th:nth-child(2), .levels td:nth-child(2) { text-align: left; }
.levels th { color: var(--muted); font-weight: 500; font-size: 13px; }
.levels tr:last-child td { border-bottom: 0; }
.cntbar { display: inline-block; height: 10px; border-radius: 3px; background: var(--accent); vertical-align: -1px; margin-left: 8px; opacity: .7; }
.filters { padding: 14px; display: grid; gap: 12px; background: var(--surface); border-bottom: 1px solid var(--line); border-radius: 12px 12px 0 0; z-index: 5; }
@media (min-width: 641px) and (min-height: 760px) { .filters { position: sticky; top: 0; box-shadow: 0 8px 18px -16px rgba(0,0,0,.55); } }
.frow { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; }
.fgroup { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.flabel { color: var(--muted); font-size: 13px; white-space: nowrap; }
.search { min-width: 220px; flex: 1 1 220px; max-width: 340px; padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.chip-toggle { border: 1px solid var(--line); background: var(--paper); border-radius: 999px; padding: 4px 11px; cursor: pointer; font-size: 13px; }
.chip-toggle:hover { border-color: var(--accent); }
.chip-toggle[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.rng { width: 58px; padding: 5px 6px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); text-align: center; }
select.sel { padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); max-width: 100%; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.status { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px; color: var(--muted); }
.status strong { color: var(--ink); }
.toast { font-weight: 500; }
.ledger { overflow-x: auto; }
table.st { border-collapse: separate; border-spacing: 0; width: 100%; min-width: 1380px; }
.st th { background: var(--surface); text-align: left; font-weight: 500; color: var(--muted); font-size: 13px; padding: 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.st th.sortable { cursor: pointer; user-select: none; }
.st th.sortable:hover { color: var(--ink); }
.st th .arr { display: inline-block; width: 1em; color: var(--accent); }
.st th.ca { color: var(--setA); }
.st th.cb { color: var(--setB); }
.st th.cc { color: var(--setC); }
.st td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.st tbody tr.main { cursor: pointer; }
.st tbody tr.main:hover td, .st tbody tr.main.open td { background: var(--hover); }
.st td.r { text-align: right; font-variant-numeric: tabular-nums; }
.nm { display: grid; }
.nm .zh { font-weight: 700; }
.nm .en { color: var(--muted); font-size: 12px; letter-spacing: .02em; }
.tot { font-size: 18px; font-weight: 700; }
.tot small { color: var(--muted); font-weight: 400; font-size: 12px; }
.breakdown { display: block; color: var(--muted); font-size: 11.5px; white-space: nowrap; }
.rank { font-size: 16px; font-weight: 700; }
.tie { display: inline-block; margin-left: 4px; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-weight: 400; vertical-align: 2px; }
.score { display: grid; gap: 4px; min-width: 86px; }
.score .s { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.score .s small { color: var(--muted); font-weight: 400; font-size: 12px; }
.st .qs { max-width: 300px; }
tr.absent td { color: var(--muted); }
.abs-tag { font-size: 12.5px; border: 1px dashed var(--line); border-radius: 6px; padding: 2px 8px; }
tr.detail td { background: var(--hover); padding: 12px 10px 16px; }
.strip-h { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; margin-bottom: 8px; font-size: 12.5px; color: var(--muted); }
.strip-h strong { color: var(--ink); }
.qa { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 14px; }
.qcard { padding: 14px; display: grid; gap: 10px; align-content: start; }
.qcard.a h3 { color: var(--setA); }
.qcard.b h3 { color: var(--setB); }
.qcard.c h3 { color: var(--setC); }
.qcard .note { font-size: 12.5px; color: var(--muted); }
.qlist { display: grid; gap: 3px; }
.qrow { display: grid; grid-template-columns: 40px 1fr 52px; gap: 8px; align-items: center; border: 0; background: transparent; padding: 3px 4px; border-radius: 6px; cursor: pointer; text-align: left; }
.qrow:hover, .qrow.on { background: var(--hover); }
.qrow.on { outline: 1px solid var(--accent); }
.qrow .ql { font-family: var(--font-mono); font-size: 12.5px; }
.qrow .qp { text-align: right; font-variant-numeric: tabular-nums; font-size: 12.5px; font-weight: 600; }
.stack { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--blank-soft); }
.stack i { display: block; height: 100%; }
.stack .s-ok { background: var(--ok); }
.stack .s-bad { background: var(--bad); }
.stack .s-blank { background: var(--blank); opacity: .45; }
.flag { color: var(--bad); font-weight: 600; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--paper); font-size: 12px; padding: 6px 8px; border-radius: 6px; z-index: 30; max-width: 260px; line-height: 1.45; display: none; }
.foot { color: var(--muted); font-size: 12.5px; display: grid; gap: 4px; }
.empty { padding: 28px; text-align: center; color: var(--muted); }

/* preview overlay */
.overlay { position: fixed; inset: 0; background: rgba(10, 14, 20, .55); z-index: 40; overflow-y: auto; padding: 24px 12px; }
.overlay .sheetwrap { max-width: 1000px; margin: 0 auto; background: var(--paper); border-radius: 14px; padding: 4px 0 12px; }
.overlay .ovbar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px clamp(16px, 3vw, 32px) 0; flex-wrap: wrap; }
.overlay .ovbar span { color: var(--muted); font-size: 13px; }

@media (max-width: 640px) {
  .search { max-width: none; }
  .metric .v { font-size: 28px; }
  .lvbadge { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
</style>

<script>
(function () {
  "use strict";
  const VAULT = JSON.parse(document.getElementById("vault").textContent);
  const app = document.getElementById("app");
  const tip = document.getElementById("tip");
  const TITLE = k => k + " Maths DSE MC 成績";
  const CLASSES = ["6A", "6B", "6C", "6D"];
  const MC_HREF = "DSE_Paper2_MC_Challenge.html";
  // Level cut-offs on total correct answers (out of 45)
  const LEVELS = [
    { id: "<2",  label: "未達 Level 2", short: "未達 L2", min: 0,  max: 14, i: 0 },
    { id: "2",   label: "Level 2",   short: "L2",   min: 15, max: 19, i: 1 },
    { id: "3",   label: "Level 3",   short: "L3",   min: 20, max: 29, i: 2 },
    { id: "4",   label: "Level 4",   short: "L4",   min: 30, max: 37, i: 3 },
    { id: "5",   label: "Level 5",   short: "L5",   min: 38, max: 39, i: 4 },
    { id: "5*",  label: "Level 5*",  short: "L5*",  min: 40, max: 43, i: 5 },
    { id: "5**", label: "Level 5**", short: "L5**", min: 44, max: 45, i: 6 }
  ];
  const levelOf = t => LEVELS.find(l => t >= l.min && t <= l.max);
  const pad = n => String(n).padStart(2, "0");
  const pct = (a, b) => b ? a / b * 100 : 0;
  const fmt1 = x => (Math.round(x * 10) / 10).toFixed(1);
  const avg = arr => arr.reduce((a, b) => a + b, 0) / (arr.length || 1);
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined && text !== null) e.textContent = text; return e; };

  // ---------- crypto ----------
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = new TextEncoder();
  async function deriveKey(password, salt) {
    if (!window.crypto || !crypto.subtle) throw new Error("nocrypto");
    const base = await crypto.subtle.importKey("raw", enc.encode(password), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: b64(salt), iterations: VAULT.iter }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function openWith(key, box, aad) {
    const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(box.i), additionalData: enc.encode(aad) }, key, b64(box.c));
    return JSON.parse(new TextDecoder().decode(plain));
  }
  const normName = x => String(x || "").normalize("NFKC").replace(/\s+/g, "");
  async function openStudent(k, name) {
    const C = VAULT.classes[k];
    if (!C || !C.boxes.length) throw new Error("noclass");
    const key = await deriveKey(k + "|" + normName(name), C.s);
    for (const box of C.boxes) { try { return await openWith(key, box, "student:" + k); } catch (e) { /* 不是這位學生 */ } }
    throw new Error("nomatch");
  }
  async function openTeacher(pass) {
    return openWith(await deriveKey(pass, VAULT.teacher.s), VAULT.teacher, "teacher");
  }

  // ---------- scoring ----------
  function score(ansStr, D) {
    if (!ansStr) return null;
    const KEY = D.key;
    const ans = ansStr.split("").map(c => c === "_" ? "" : c);
    const st = ans.map((a, i) => a === KEY[i] ? "ok" : (a === "" ? "blank" : "bad"));
    const o = { ans, st };
    o.total = st.filter(x => x === "ok").length;
    o.wrongN = st.filter(x => x === "bad").length;
    o.blankN = st.filter(x => x === "blank").length;
    const miss = list => list.filter(q => st[q - 1] !== "ok").map(q => ({ q, a: ans[q - 1], s: st[q - 1] }));
    o.aC = D.setA.filter(q => st[q - 1] === "ok").length;
    o.bC = D.setB.filter(q => st[q - 1] === "ok").length;
    o.cC = D.setC.filter(q => st[q - 1] === "ok").length;
    o.aW = miss(D.setA); o.bW = miss(D.setB); o.cW = miss(D.setC);
    o.level = levelOf(o.total);
    return o;
  }
  function ranges(qs) {
    const out = []; let i = 0;
    while (i < qs.length) {
      let j = i;
      while (j + 1 < qs.length && qs[j + 1] === qs[j] + 1) j++;
      out.push(j - i >= 2 ? "Q" + qs[i] + "–" + qs[j] : qs.slice(i, j + 1).map(q => "Q" + q).join(", "));
      i = j + 1;
    }
    return out.join(", ");
  }

    thead.append(hr); tb.append(thead);

    tb.append(body); wrap.append(tb); mt.append(wrap);

  // ---------- teacher ----------
  function renderTeacherPage(T, exId, kId) {
    const KL = T.classes.find(c => c.id === kId) || T.classes[0], K = KL.id;
    const D = KL.exams.find(e => e.id === exId) || KL.exams[0];
    app.textContent = "";
    const KEY = D.key, SETA = D.setA, SETB = D.setB, SETC = D.setC;
    const students = D.students.map(s => Object.assign({ no: s.no, en: s.en, zh: s.zh, rawAns: s.ans, absent: !s.ans }, score(s.ans, D) || {}));
    const present = students.filter(s => !s.absent);
    const n = present.length;
    const distinct = [...new Set(present.map(s => s.total))].sort((a, b) => b - a);
    present.forEach(s => {
      s.rankDense = distinct.indexOf(s.total) + 1;
      s.rankStd = 1 + present.filter(t => t.total > s.total).length;
      s.tie = present.filter(t => t.total === s.total).length > 1;
    });
    const qstat = [];
    for (let q = 1; q <= 45; q++) {
      let ok = 0, bad = 0, blank = 0;
      present.forEach(s => { const x = s.st[q - 1]; if (x === "ok") ok++; else if (x === "bad") bad++; else blank++; });
      qstat[q] = { ok, bad, blank };
    }
    const CLS = { n, avg: avg(present.map(s => s.total)), max: Math.max(...present.map(s => s.total)), min: Math.min(...present.map(s => s.total)), avgA: avg(present.map(s => s.aC)), avgB: avg(present.map(s => s.bC)), avgC: avg(present.map(s => s.cC)), qok: qstat.slice(1).map(x => x.ok) };

    const w = el("div", "wrap");
    w.append(topbar("數學科老師", "教師", D.title + " · 45 題 MC · 報告日期 " + D.date, K));
    w.append(examSwitch(CLASSES.map(k => { const c = T.classes.find(x => x.id === k); return { id: k, title: k, note: c ? c.exams[0].students.length + " 位學生" : "未有成績", disabled: !c }; }), K, id => renderTeacherPage(T, D.id, id), "班別", "classSwitch"));
    w.append(examSwitch(KL.exams.map(e => ({ id: e.id, title: e.title, note: e.students.filter(x => x.ans).length + " 人應考" })), D.id, id => renderTeacherPage(T, id, K)));
    const sets = el("div", "sets");
    const dA = el("div", "setdef a"); dA.append(el("b", null, "Set A · Level 3"), el("span", null, SETA.length + " 題" + ruleText(D, "A") + "：" + ranges(SETA)));
    const dB = el("div", "setdef b"); dB.append(el("b", null, "Set B · Level 4"), el("span", null, SETB.length + " 題" + ruleText(D, "B") + "：" + ranges(SETB)));
    const dC = el("div", "setdef c"); dC.append(el("b", null, "Set C · Level 5+"), el("span", null, SETC.length + " 題" + ruleText(D, "C") + "：" + secText(SETC)));
    sets.append(dA, dB, dC); w.append(sets);

    // tiles

      if (e.key !== "Enter" && e.key !== " ") return;
      const tr = e.target.closest("tr.main"); if (!tr || tr.classList.contains("absent")) return;
      e.preventDefault(); toggleRow(+tr.dataset.no);
    });
    $("btnCopy").addEventListener("click", async () => {
      const fmtQ = list => list.map(m => "Q" + m.q + (m.s === "blank" ? "(未答)" : "(" + m.a + ")")).join(" ");
      const rows = [["學號", "英文姓名", "中文姓名", "等級", "總對題/45", "全班排名", "Set A 對題/" + SETA.length, "Set A 錯的題目", "Set B 對題/" + SETB.length, "Set B 錯的題目", "Set C 對題/" + SETC.length, "Set C 錯的題目"].join("\t")];
      shown.forEach(s => {
        if (s.absent) rows.push([K + pad(s.no), s.en, s.zh, "", "沒有作答紀錄", "", "", "", "", "", "", ""].join("\t"));
        else rows.push([K + pad(s.no), s.en, s.zh, s.level.label, s.total, rankOf(s), s.aC, fmtQ(s.aW) || "全對", s.bC, fmtQ(s.bW) || "全對", s.cC, fmtQ(s.cW) || "全對"].join("\t"));
      });
      const msg = $("toast");
      try { await navigator.clipboard.writeText(rows.join("\n")); msg.style.color = "var(--ok)"; msg.textContent = "已複製 " + shown.length + " 行，可直接貼上 Excel"; }
      catch (err) { msg.style.color = "var(--bad)"; msg.textContent = "瀏覽器不允許複製，請稍後再試"; }
      setTimeout(() => { msg.textContent = ""; }, 3500);
    });
    render();
    window.scrollTo(0, 0);
  }

  renderLogin();
})();
</script>
</body>
</html>
